<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og.png 원본 (1200×630)</title>
<!-- 이 페이지를 1200×630 창으로 캡처한 것이 ../og.png 다. -->
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 548px 1fr;
    column-gap: 64px;
    align-items: center;
    padding: 0 72px;
    box-sizing: border-box;
    background: #0a0e17;
    color: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  svg { display: block; width: 100%; height: auto; }
  #pic rect { fill: #ffd60a; }
  #pic text {
    fill: #14213d;
    font: 900 270px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-anchor: middle;
  }
  .mark {
    fill: #9aa5b8;
    font: 500 9.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-anchor: middle;
  }
  h1, p { margin: 0; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
  h1 { font-size: 68px; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  p { margin-top: 18px; font-size: 34px; color: #b9c2d3; }
  p:lang(ja) { margin-top: 30px; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
</style>
</head>
<body>
  <svg id="demo">
    <defs>
      <g id="pic">
        <rect width="400" height="300"/>
        <text x="200" y="247">20</text>
      </g>
    </defs>
  </svg>
  <div>
    <h1>사진 세로 분할</h1>
    <p lang="ja">写真の縦分割</p>
    <p lang="en">Photo Strip Splitter</p>
  </div>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const demo = document.getElementById('demo');
const n = 20, w = 400 / n, gap = 3;
demo.setAttribute('viewBox', `0 0 ${400 + gap * (n - 1)} 318`);
for (let i = 0; i < n; i++) {
  const x = i * (w + gap);
  const strip = document.createElementNS(NS, 'svg');
  strip.setAttribute('x', x);
  strip.setAttribute('width', w);
  strip.setAttribute('height', 300);
  strip.setAttribute('viewBox', `${i * w} 0 ${w} 300`);
  const use = document.createElementNS(NS, 'use');
  use.setAttribute('href', '#pic');
  strip.append(use);
  const mark = document.createElementNS(NS, 'text');
  mark.setAttribute('class', 'mark');
  mark.setAttribute('x', x + w / 2);
  mark.setAttribute('y', 314);
  mark.textContent = String(i + 1).padStart(2, '0');
  demo.append(strip, mark);
}
</script>
</body>
</html>
